# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Conda recipe used to build the .conda artifact attached to each GitHub
# Release. Sources from the local checkout, version read from pyproject.toml.
#
# A separate, conda-forge-shaped recipe lives in
# docs/misc/conda-forge-submission/ for the future staged-recipes PR; that
# one sources from the PyPI sdist with a pinned sha256.
#
# Local build:  just conda-build
# CI build:     .github/workflows/conda-release.yml

context:
  name: pytest-hamilton
  # Version is injected from pyproject.toml by `just conda-build` and by
  # .github/workflows/conda-release.yml — single source of truth lives in
  # pyproject.toml. Avoids rattler-build's still-experimental load_from_file.
  version: ${{ env.get("PKG_VERSION") }}
  python_min: "3.10"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pytest >=7.0
    - sf-hamilton >=1.28.0

tests:
  - python:
      imports:
        - pytest_hamilton
        - pytest_hamilton.pytest_hamilton
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/gpfreitas/pytest-hamilton
  repository: https://github.com/gpfreitas/pytest-hamilton
  summary: Pytest plugin that creates automatic Hamilton-based fixtures for your tests.
  description: |
    pytest-hamilton is a pytest plugin that creates automatic
    Apache Hamilton based fixtures for your tests, generating one
    fixture per DAG node from a Hamilton driver.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gpfreitas
