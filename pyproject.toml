[project]
name = "pytest-hamilton"
version = "0.1.0"
description = "Pytest Hamilton creates automatic hamilton-based fixtures for your tests."
readme = "README.md"
authors = [
  {name = "Guilherme Pereira de Freitas", email = "guilherme.freitas@gmail.com"}
]
maintainers = [
  {name = "Guilherme Pereira de Freitas", email = "guilherme.freitas@gmail.com"}
]
classifiers = [
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
license = {text = "MIT"}
dependencies = [
  "pytest>=7.0",
  "sf-hamilton",
]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",    # testing
    "ruff",      # linting
    "ty",        # type checking
    "ipdb",      # debugging
]

[project.urls]
bugs = "https://github.com/gpfreitas/pytest-hamilton/issues"
changelog = "https://github.com/gpfreitas/pytest-hamilton/blob/main/HISTORY.md"
homepage = "https://github.com/gpfreitas/pytest-hamilton"

[project.entry-points.pytest11]
hamilton = "pytest_hamilton.pytest_hamilton"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
