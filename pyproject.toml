[project]
name = "pytest-hamilton"
version = "0.1.0"
description = "Pytest Hamilton creates automatic hamilton-based fixtures for your tests."
readme = "README.md"
authors = [
  {name = "Guilherme Pereira de Freitas", email = "guilherme.freitas@gmail.com"}
]
maintainers = [
  {name = "Guilherme Pereira de Freitas", email = "guilherme.freitas@gmail.com"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/gpfreitas/pytest_hamilton/issues"
changelog = "https://github.com/gpfreitas/pytest_hamilton/blob/main/changelog.md"
homepage = "https://github.com/gpfreitas/pytest_hamilton"

[project.scripts]
pytest_hamilton = "pytest_hamilton.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
