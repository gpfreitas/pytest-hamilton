# This workflow installs Python dependencies and runs tests for the plugin
# and each example template across the supported Python matrix, via nox.
# See: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python

name: Test Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Lint with ruff
      run: |
        uv run --extra test ruff check --select=E9,F63,F7,F82
        uv run --extra test ruff check --exit-zero --statistics
    - name: Run plugin tests (nox)
      run: uvx nox -s "tests-${{ matrix.python-version }}"
    - name: Run example templates (nox)
      run: uvx nox -s "test_examples-${{ matrix.python-version }}"
